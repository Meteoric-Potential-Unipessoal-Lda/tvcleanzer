name: tvcleanzer
description: TVCleanzer — free app to clean bloatware from Android TV
version: 0.9.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # ADB crypto
  pointycastle: ^3.9.1           # RSA-2048 key generation
  # State management
  flutter_riverpod: ^2.5.1
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  # Launcher wallpaper from the phone's photos
  image_picker: ^1.1.2
  # Storage (RSA key pair + preferences)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

# ── App Icon configuration ──────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  adaptive_icon_background: "assets/icon/icon_bg.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ── Splash screen configuration ─────────────────────────────────────────────
flutter_native_splash:
  color: "#0B1120"
  image: assets/icon/icon.png
  color_dark: "#0B1120"
  image_dark: assets/icon/icon.png
  android_12:
    color: "#0B1120"
    icon_background_color: "#0B1120"
    image: assets/icon/splash.png
    color_dark: "#0B1120"
    icon_background_color_dark: "#0B1120"
    image_dark: assets/icon/splash.png
  fullscreen: false
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/packages.json        # bundled package database (from packages.tsv)
    - assets/icon/
    - assets/launcher/            # TVCleanzer Launcher APK (launcher/build.sh)
