<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#05080F;--fg:#F1F5F9;--mid:#9FB0C8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--bg)}
body{font-family:"Inter",sans-serif;color:var(--fg);position:relative}
.bg{position:absolute;inset:0;overflow:hidden}
.g1{position:absolute;width:140%;aspect-ratio:1;left:-60%;top:-45%;background:radial-gradient(closest-side,rgba(0,207,168,.34),rgba(0,207,168,0))}
.g2{position:absolute;width:150%;aspect-ratio:1;right:-75%;bottom:-40%;background:radial-gradient(closest-side,rgba(124,92,255,.40),rgba(124,92,255,0))}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) calc(var(--u)*1px),transparent calc(var(--u)*1.4px));background-size:calc(var(--u)*26px) calc(var(--u)*26px);-webkit-mask-image:radial-gradient(ellipse 80% 40% at 50% 10%,#000 0%,transparent 80%)}
.cap{position:absolute;left:0;right:0;top:calc(var(--u)*var(--top)*1px);text-align:center;padding:0 calc(var(--u)*50px)}
h1{font-family:"Inter Display","Inter";font-weight:900;font-size:calc(var(--u)*var(--fs)*1px);line-height:1.0;letter-spacing:-.035em;text-wrap:balance}
h1 .grad{background:linear-gradient(100deg,#00CFA8 0%,#7CF5D8 50%,#FFFFFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:calc(var(--u)*20px);font-size:calc(var(--u)*var(--ss)*1px);color:var(--mid);font-weight:500;line-height:1.3}
.ph{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u)*var(--pt)*1px);height:calc(var(--u)*var(--phh)*1px);aspect-ratio:1320/2868;
 border-radius:calc(var(--u)*46px);padding:calc(var(--u)*9px);background:linear-gradient(160deg,#2B3A55,#121A2B 40%,#1C2540);
 box-shadow:0 calc(var(--u)*30px) calc(var(--u)*90px) rgba(0,0,0,.6),0 0 calc(var(--u)*80px) rgba(0,207,168,.18)}
.ph img{width:100%;height:100%;border-radius:calc(var(--u)*38px);display:block;object-fit:cover}
.isl{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u)*22px);width:28%;height:calc(var(--u)*24px);border-radius:99px;background:#000}
</style></head><body>
<div class="bg"><div class="g1"></div><div class="g2"></div><div class="dots"></div></div>
<div class="cap"><h1 id="t"></h1><p id="s"></p></div>
<div class="ph"><img id="i"><div class="isl"></div></div>
<script>
const q=new URLSearchParams(location.search);
const [a,b]=q.get('t').split('<br>');
document.getElementById('t').innerHTML=a+'<br><span class="grad">'+b+'</span>';
document.getElementById('s').textContent=q.get('s');
document.getElementById('i').src=q.get('img');
window.fit=()=>{const cs=getComputedStyle(document.documentElement);const u=+cs.getPropertyValue('--u');
 const lim=(+cs.getPropertyValue('--pt')-+cs.getPropertyValue('--top')-14)*u;const cap=document.querySelector('.cap');
 let fs=+cs.getPropertyValue('--fs'),ss=+cs.getPropertyValue('--ss');
 while(cap.offsetHeight>lim&&fs>18){fs*=.96;ss*=.98;document.documentElement.style.setProperty('--fs',fs);document.documentElement.style.setProperty('--ss',ss);}
 return fs;};
</script></body></html>
